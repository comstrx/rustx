[files]
extend-exclude = [
    "**/.git/**",
    "**/.idea/**",
    "**/node_modules/**",
    "**/dist/**",
    "**/build/**",
    "**/target/**",
    "**/vendor/**",
    "**/venv/**",
    "**/.venv/**",
    "**/.cache/**",
    "**/.turbo/**",
    "**/.vscode/**",
    "**/.next/**",
    "**/.nuxt/**",
    "**/*.lock",
    "**/__pycache__/**",
]
ignore-files = true
ignore-dot = true
ignore-vcs = true
ignore-hidden = false
ignore-global = false
ignore-parent = false

[default]
binary = false
check-filename = true
check-file = true
unicode = true
locale = "en-us"
extend-ignore-re = [
    "(?s)-----BEGIN PGP SIGNATURE-----.*?-----END PGP SIGNATURE-----",
    "\\bnl -ba\\b",
]
extend-ignore-words-re = ["(?i)^fpr$"]

[type.lock]
extend-glob = ["**/*.lock"]
check-file = false
check-filename = false

[type.minified]
extend-glob = ["**/*.min.js", "**/*.min.css"]
check-file = false

[type.generated]
extend-glob = ["**/generated/**", "**/*.gen.*", "**/*.g.*"]
check-file = false

[default.extend-identifiers]
"DNS_ERROR_INVAILD_VIRTUALIZATION_INSTANCE_NAME" = "DNS_ERROR_INVAILD_VIRTUALIZATION_INSTANCE_NAME"
"ERROR_FILENAME_EXCED_RANGE" = "ERROR_FILENAME_EXCED_RANGE"
"ERROR_FILENAME_EXCEDE_RANGE" = "ERROR_FILENAME_EXCED_RANGE"
"INVAILD" = "INVALID"

[default.extend-words]
"widnows" = "windows"
