name: Daily

on:
  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  sanitizer:
    name: sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan, msan, lsan]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - uses: cargo-bins/cargo-binstall@3be4ad2b146f3302f92e5956c54fedbb6ae8cccc # v1.25.3

      - name: Setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask setup

      - name: Sanitizer
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: cargo xtask sanitizer --sanitizer "${SANITIZER}"

  miri:
    name: miri
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - uses: cargo-bins/cargo-binstall@3be4ad2b146f3302f92e5956c54fedbb6ae8cccc # v1.25.3

      - name: Setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask setup

      - name: Miri
        run: cargo xtask miri

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - uses: cargo-bins/cargo-binstall@3be4ad2b146f3302f92e5956c54fedbb6ae8cccc # v1.25.3

      - name: Setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask setup

      - name: Fuzz
        run: cargo xtask fuzz --run --budget 3600
