name: Base

on:
  workflow_call:
    inputs:
      runner:
        required: false
        type: string
        default: ubuntu-latest

      command:
        required: true
        type: string

      args:
        required: false
        type: string
        default: ''

      profile:
        required: false
        type: string
        default: stable

      toolchain:
        required: false
        type: string
        default: ''

      cache-key:
        required: false
        type: string
        default: ''

      timeout:
        required: false
        type: number
        default: 30

      codecov:
        required: false
        type: boolean
        default: false

      registry:
        required: false
        type: boolean
        default: false

    secrets:
      CODECOV_TOKEN:
        required: false

      CARGO_REGISTRY_TOKEN:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-Dwarnings'
  RUST_BACKTRACE: '1'
  RUST_STABLE: stable
  RUST_MSRV: '1.98.0'
  RUST_NIGHTLY: nightly-2026-08-20

jobs:
  run:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout }}

    steps:
      - id: resolve
        env:
          PROFILE: ${{ inputs.profile }}
          TOOLCHAIN: ${{ inputs.toolchain }}

        run: |
          tc="${TOOLCHAIN}"

          if [[ -z "${tc}" ]]; then
              case "${PROFILE}" in
                  stable)  tc="${RUST_STABLE}"  ;;
                  msrv)    tc="${RUST_MSRV}"    ;;
                  nightly) tc="${RUST_NIGHTLY}" ;;
                  *) echo "base: invalid profile '${PROFILE}'" >&2; exit 2 ;;
              esac
          fi

          echo "toolchain=${tc}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ steps.resolve.outputs.toolchain }}
          cache-key: ${{ inputs.cache-key || inputs.command }}

      - uses: cargo-bins/cargo-binstall@v1.23.0

      - name: Running bash ci
        env:
          COMMAND: ${{ inputs.command }}
          ARGS: ${{ inputs.args }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODECOV_TOKEN: ${{ inputs.codecov && secrets.CODECOV_TOKEN || '' }}
          CARGO_REGISTRY_TOKEN: ${{ inputs.registry && secrets.CARGO_REGISTRY_TOKEN || '' }}

        run: |
          read -r -a extra <<< "${ARGS}"
          bash ./scripts/run.sh "${COMMAND}" "${extra[@]}"
