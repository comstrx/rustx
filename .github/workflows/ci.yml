name: CI

on:
  workflow_dispatch:

  push:
    branches: ['main']
    tags: ['v*']

  pull_request:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    uses: ./.github/workflows/_base.yml
    with: { profile: stable, command: ci-stable, runner: '${{ matrix.os }}', timeout: 60 }

  nightly:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    uses: ./.github/workflows/_base.yml
    with: { profile: nightly, command: ci-nightly, runner: '${{ matrix.os }}', timeout: 60 }

  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    uses: ./.github/workflows/_base.yml
    with: { profile: msrv, command: ci-msrv, runner: '${{ matrix.os }}', timeout: 60 }

  hack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    uses: ./.github/workflows/_base.yml
    with: { profile: stable, command: ci-hack, runner: '${{ matrix.os }}', timeout: 60 }

  doc:
    uses: ./.github/workflows/_base.yml
    with: { profile: stable, command: ci-doc }

  panic:
    uses: ./.github/workflows/_base.yml
    with: { profile: nightly, command: ci-panic }

  fmt:
    uses: ./.github/workflows/_base.yml
    with: { profile: nightly, command: ci-fmt, timeout: 15 }

  lint:
    uses: ./.github/workflows/_base.yml
    with: { profile: stable, command: ci-lint, timeout: 15 }

  clippy:
    uses: ./.github/workflows/_base.yml
    with: { profile: stable, command: ci-clippy }

  audit:
    uses: ./.github/workflows/_base.yml
    with: { profile: stable, command: ci-audit }

  vet:
    uses: ./.github/workflows/_base.yml
    with: { profile: stable, command: ci-vet }

  udeps:
    uses: ./.github/workflows/_base.yml
    with: { profile: stable, command: ci-udeps }

  security:
    uses: ./.github/workflows/_base.yml
    with: { profile: stable, command: ci-security, timeout: 20 }

  semver:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    uses: ./.github/workflows/_base.yml
    with: { profile: stable, command: ci-semver }

  coverage:
    needs: [stable, nightly, msrv, hack, doc, panic, fmt, lint, clippy, audit, security, vet, udeps]
    secrets: { CODECOV_TOKEN: '${{ secrets.CODECOV_TOKEN }}' }

    uses: ./.github/workflows/_base.yml
    with: { profile: stable, command: ci-coverage, codecov: true, timeout: 60 }

  ci-gate:
    if: always()
    needs: [stable, nightly, msrv, hack, doc, panic, fmt, lint, clippy, audit, security, vet, udeps, coverage]

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required jobs
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}

        run: |
          count="$(jq -r 'length' <<< "${RESULTS}")"
          failed=0

          [[ "${count}" -gt 0 ]] || { echo "ci-gate: no upstream job results." >&2; exit 1; }

          while IFS='=' read -r job result; do
              printf '%-12s %s\n' "${result}" "${job}"
              [[ "${result}" == "success" ]] || failed=1
          done < <(jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<< "${RESULTS}")

          (( failed == 0 )) || { echo "ci-gate: required jobs did not succeed." >&2; exit 1; }

          echo "ci-gate: ${count} required jobs succeeded."

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_ENABLED == 'true'
    needs: [ci-gate, semver]
    secrets: { CARGO_REGISTRY_TOKEN: '${{ secrets.CARGO_REGISTRY_TOKEN }}' }

    uses: ./.github/workflows/_base.yml
    with: { profile: stable, command: ci-publish, registry: true }
