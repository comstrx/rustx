debug: false
quiet: false
insecure: false
timeout: 10m0s

db:
  no-progress: true

pkg:
  include-dev-deps: true

image:
  image-config-scanners:
    - misconfig
    - secret

severity:
  - UNKNOWN
  - LOW
  - MEDIUM
  - HIGH
  - CRITICAL

vulnerability:
  ignore-status: []
  ignore-unfixed: true
  skip-vex-repo-update: false

  severity-source:
    - auto

scan:
  disable-telemetry: true
  skip-version-check: true
  parallel: 10
  detection-priority: comprehensive
  show-suppressed: true

  scanners:
    - vuln
    - secret
    - misconfig
    - license

  skip-dirs:
    - '**/.git'
    - '**/.claude'
    - '**/.codex'
    - '**/.agents'
    - '**/node_modules'
    - '**/vendor'
    - '**/target'
    - '**/dist'
    - '**/build'
    - '**/out'
    - '**/coverage'
    - '**/storage'
    - '**/generated'
    - '**/Pods'
    - '**/android'
    - '**/ios'
    - '**/.fleet'
    - '**/.zed'
    - '**/.vs'
    - '**/.vscode'
    - '**/.idea'
    - '**/.next'
    - '**/.nuxt'
    - '**/.expo'
    - '**/.turbo'
    - '**/.cache'
    - '**/.vite'
    - '**/.gradle'
    - '**/.infra'
    - '**/.terraform'
    - '**/fuzz/corpus'
    - '**/fuzz/artifacts'

license:
  full: true
  ignored:
    - MIT
    - Apache-2.0
    - OFL-1.1
