name = "parse"
path = "parse.rs"

[[test]]
name = "validate"
path = "validate.rs"

[[test]]
name = "thread"
path = "thread.rs"

[[test]]
name = "rand"
path = "rand.rs"

[[test]]
name = "crypto"
path = "crypto.rs"

[[test]]
name = "file"
path = "file.rs"

[[test]]
name = "net"
path = "net.rs"

[[test]]
name = "http"
