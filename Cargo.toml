[workspace]
resolver = "3"
members = ["bloats", "benches", "examples", "tests", "crates/rustx", "crates/typing"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
readme = "README.md"
license = "AGPL-3.0-only"
description = "A production-grade Rust workspace for reusable ToolX crates."
repository = "https://github.com/comstrx/rustx"
homepage = "https://github.com/comstrx/rustx"
authors = ["comstrx"]
keywords = ["rust", "toolx", "tooling", "automation"]

[workspace.dependencies]
criterion = { version = "=0.8.1", default-features = false, features = ["cargo_bench_support"] }
rustx = { path = "crates/rustx", version = "0.1.0" }
typing = { package = "rustx-typing", path = "crates/typing", version = "0.1.0" }

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "allow"
warnings = "deny"

[workspace.lints.rustdoc]
missing_crate_level_docs = "deny"
private_intra_doc_links = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
disallowed_names = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
todo = "deny"
exit = "deny"
panic = "deny"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
multiple_crate_versions = "allow"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
debug = 0
debug-assertions = false
overflow-checks = false
incremental = false

[profile.release-fat]
inherits = "release"
lto = "fat"

[profile.release.build-override]
opt-level = 0
codegen-units = 256
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
