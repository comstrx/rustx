[workspace]
resolver = "3"
members = ["benches", "bloats", "examples", "tests", "crates/base", "crates/rustx"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
readme = "README.md"
license = "MIT OR Apache-2.0"
description = "A production-grade Rust workspace for reusable ToolX crates."
repository = "https://github.com/comstrx/rustx"
homepage = "https://github.com/comstrx/rustx"
authors = ["comstrx"]
keywords = ["rust", "toolx", "tooling", "automation"]

[workspace.dependencies]
criterion = { version = "=0.8.1", default-features = false, features = ["cargo_bench_support"] }
rustx = { path = "crates/rustx", version = "0.1.0" }
rustx-base = { path = "crates/base", version = "0.1.0" }

[workspace.lints.rust]
deprecated_safe = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
keyword_idents = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
refining_impl_trait = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unknown_or_malformed_diagnostic_attributes = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
warnings = { level = "deny", priority = -1 }

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unnameable_types = "deny"

unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
ffi_unwind_calls = "deny"

redundant_lifetimes = "deny"
single_use_lifetimes = "deny"
unused_lifetimes = "deny"

deprecated_in_future = "deny"
meta_variable_misuse = "deny"
macro_use_extern_crate = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_import_braces = "deny"
unused_qualifications = "deny"
variant_size_differences = "deny"

non_ascii_idents = "deny"

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }
missing_crate_level_docs = "deny"
private_intra_doc_links = "deny"
broken_intra_doc_links = "deny"
unescaped_backticks = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

allow_attributes = "deny"
allow_attributes_without_reason = "deny"

panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
unwrap_used = "deny"
expect_used = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
missing_asserts_for_indexing = "deny"
string_slice = "deny"
try_err = "deny"
map_err_ignore = "deny"
error_impl_error = "deny"

undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
missing_safety_doc = "deny"
not_unsafe_ptr_arg_deref = "deny"
default_union_representation = "deny"
inline_asm_x86_att_syntax = "deny"
cast_ptr_alignment = "deny"
ptr_as_ptr = "deny"
borrow_as_ptr = "deny"
ref_as_ptr = "deny"
as_ptr_cast_mut = "deny"
as_pointer_underscore = "deny"
as_underscore = "deny"
transmute_ptr_to_ptr = "deny"
mut_from_ref = "deny"
host_endian_bytes = "deny"
pointer_format = "deny"

exhaustive_enums = "deny"
exhaustive_structs = "deny"
partial_pub_fields = "deny"
field_scoped_visibility_modifiers = "deny"
pub_without_shorthand = "deny"
missing_inline_in_public_items = "deny"
multiple_inherent_impl = "deny"
renamed_function_params = "deny"
same_name_method = "deny"
unused_trait_names = "deny"
redundant_type_annotations = "deny"
absolute_paths = "deny"
unnecessary_self_imports = "deny"

alloc_instead_of_core = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"

mem_forget = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
clone_on_ref_ptr = "deny"
format_push_string = "deny"
pathbuf_init_then_push = "deny"
str_to_string = "deny"
string_add = "deny"
string_add_assign = "deny"
string_lit_chars_any = "deny"

float_cmp_const = "deny"
lossy_float_literal = "deny"
fn_to_numeric_cast_any = "deny"
precedence_bits = "deny"
suspicious_xor_used_as_pow = "deny"
separated_literal_suffix = "deny"
infinite_loop = "deny"
iter_over_hash_type = "deny"
mixed_read_write_in_expression = "deny"

dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
use_debug = "deny"
disallowed_names = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_script_idents = "deny"
non_ascii_literal = "deny"

deref_by_slicing = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
map_with_unused_argument_over_ranges = "deny"
needless_raw_strings = "deny"
ref_patterns = "deny"
rest_pat_in_fully_bound_structs = "deny"
semicolon_inside_block = "deny"
unneeded_field_pattern = "deny"
wildcard_enum_match_arm = "deny"

assertions_on_result_states = "deny"
tests_outside_test_module = "deny"
cfg_not_test = "deny"
redundant_test_prefix = "deny"

create_dir = "deny"
filetype_is_file = "deny"
verbose_file_reads = "deny"
large_include_file = "deny"

mod_module_files = "deny"
min_ident_chars = "deny"
cognitive_complexity = "deny"
doc_paragraphs_missing_punctuation = "deny"

multiple_crate_versions = "allow"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
debug = 0
debug-assertions = false
overflow-checks = false
incremental = false

[profile.release.build-override]
opt-level = 0
codegen-units = 256

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
split-debuginfo = "off"

[profile.release-checked]
inherits = "release"
debug-assertions = true
overflow-checks = true

[profile.bench]
inherits = "release"
debug = "line-tables-only"
strip = "none"
